name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs check out, build and test. Nothing here needs to write to the repo,
# and a compromised build step would inherit whatever the token is given.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches ~/.gradle between runs and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Kotlin/Native compiler that core's iOS klibs need (a few hundred
      # MB), kept between runs; the key follows the Kotlin version in the
      # root build file.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts') }}

      # FCM: the Firebase config is a repository secret, written into both app
      # modules before the build so the CI APKs can register for push. Forks
      # without the secret build with push off, exactly like a local checkout.
      - name: Write google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > wear/google-services.json

      # The hosted runner ships the Android SDK with ANDROID_HOME set, so no
      # separate SDK setup step is needed. Build-tools 36.0.0 (pinned in the
      # three Android modules) and platform 36 are fetched by AGP on demand if
      # missing.
      # `test` covers both modules: :core:test (the Android-free domain module)
      # and the app's unit tests, including the Robolectric flow tests.
      # The watch app (wear/, with its own unit tests) is in both as well.
      # core's iOS klibs are compiled too (cross-compiled, no Mac): that is
      # what proves commonMain has no JVM-only code (CLAUDE.md, "core/").
      # The web app has its own job below.
      - name: Build debug APK, compile core for iOS and run unit tests
        run: ./gradlew assembleDebug :wear:assembleDebug :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64 test -x :server:test --no-daemon --stacktrace

      # What Play checks at upload, checked here first: the phone app targets
      # 36 (Play's requirement since 2026-08-31), the watch app 35 (deploy/play.md).
      - name: Check the APKs' targetSdk
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "targetSdkVersion:'36'"
          "$BT/aapt2" dump badging wear/build/outputs/apk/debug/wear-debug.apk | grep "targetSdkVersion:'35'"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/test-results/**"
          if-no-files-found: ignore

      # PNGs of every screen the Robolectric flow tests pass through, for a
      # human to look at. Also uploaded when a flow test fails: that is when
      # the picture matters most.
      - name: Upload flow test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots
          path: app/build/reports/flow-screenshots/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tung-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload watch debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tung-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 14

  web:
    name: Web app build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The PWA's static site, and its tests in the runner's Chrome (Karma).
      # Kotlin/JS downloads Node.js and Yarn into ~/.gradle (cached above).
      - name: Build the web app and run its tests
        run: ./gradlew :web:jsBrowserDistribution :web:jsBrowserTest --no-daemon --stacktrace

      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-results
          path: web/build/test-results/
          if-no-files-found: ignore

      # The site as it would be deployed: open index.html from a static host.
      - name: Upload the web app
        uses: actions/upload-artifact@v4
        with:
          name: tung-web
          path: web/build/dist/js/productionExecutable/
          retention-days: 14

  server:
    name: Server tests and Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The server tests run against a real Postgres in Docker (Testcontainers),
      # which the hosted runner provides.
      - name: Server tests
        run: ./gradlew :server:test --no-daemon --stacktrace

      - name: Upload server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/build/test-results/
          if-no-files-found: ignore

      - name: Build the Docker image
        run: docker build -f server/Dockerfile -t tung-server:ci .
