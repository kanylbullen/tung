name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs check out, build and test. Nothing here needs to write to the repo,
# and a compromised build step would inherit whatever the token is given.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Caches ~/.gradle between runs and validates the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The hosted runner ships the Android SDK with ANDROID_HOME set, so no
      # separate SDK setup step is needed. Build-tools and platform 35 are
      # fetched by AGP on demand if missing.
      # `test` covers both modules: :core:test (the Android-free domain module)
      # and the app's unit tests, including the Robolectric flow tests.
      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug test --no-daemon --stacktrace

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/test-results/**"
          if-no-files-found: ignore

      # PNGs of every screen the Robolectric flow tests pass through, for a
      # human to look at. Also uploaded when a flow test fails: that is when
      # the picture matters most.
      - name: Upload flow test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-screenshots
          path: app/build/reports/flow-screenshots/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tung-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
