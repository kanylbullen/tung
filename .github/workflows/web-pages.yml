name: Moved page on GitHub Pages

# https://kanylbullen.github.io/tung/ no longer serves the web app (issue
# #153): that origin is shared by every Pages site of the account, so a
# session token or an AI key kept there is readable by all of them. The app
# lives at https://tung.xuper.fun/app/. What is published here is web/pages/:
# a page that revokes and forgets what the old copy stored and sends the
# person on, and a service worker that retires the old one's cache.
on:
  push:
    branches: [main]
    paths:
      - "web/pages/**"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

# Nothing by default; the deploy job alone may publish to Pages.
permissions:
  contents: read

# One deployment at a time, and a running one is never cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pages serves 404.html for an unknown path: every old link and
      # bookmark under the site lands on the moved page.
      - name: Add the fallback page
        run: cp web/pages/index.html web/pages/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/pages/

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
