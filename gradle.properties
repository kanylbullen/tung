# 4 GB: linking the release iOS framework (Compose and Kotlin/Native) ran out of 2 GB.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# core/'s and data/'s iOS klibs compile on Linux (and in CI) too; only linking a binary needs a Mac.
kotlin.native.enableKlibsCrossCompilation=true


