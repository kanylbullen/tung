org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# data/ shares FakeSyncServer and MemoryTokenStore with the tests of app/ and wear/ as Kotlin test fixtures.
android.experimental.enableTestFixturesKotlinSupport=true

# core/'s iOS klibs compile on Linux (and in CI) too; only linking a binary needs a Mac.
kotlin.native.enableKlibsCrossCompilation=true
