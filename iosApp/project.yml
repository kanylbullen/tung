# The iPhone app's Xcode project, generated by XcodeGen (`xcodegen` in this
# directory) so the repository carries this file and not a .xcodeproj.
# The app is a SwiftUI shell around the ui module's Compose screen
# (MainViewController), linked as the static framework TungUI that Gradle
# builds in the pre-build script. See README.md.
name: Tung
options:
  bundleIdPrefix: io.github.kanylbullen
  # Compose Multiplatform's ICU data is built for iOS 17.2; a lower target
  # links with a warning that the object is newer than the app.
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Tung:
    type: application
    platform: iOS
    # A shared scheme, so `xcodebuild -scheme Tung` works on a fresh checkout.
    scheme: {}
    sources:
      - Tung
    info:
      path: Tung/Info.plist
      properties:
        CFBundleDisplayName: Tung
        # From the build settings, so CURRENT_PROJECT_VERSION on the command
        # line (testflight.sh) is the uploaded build number; XcodeGen would
        # otherwise write a fixed 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Compose Multiplatform draws at the display's rate; without this key
        # a ProMotion iPhone is capped at 60 Hz and Compose logs an error.
        CADisableMinimumFrameDurationOnPhone: true
        # Only HTTPS through the system and no encryption of its own, so the
        # export compliance question is answered here instead of per build.
        ITSAppUsesNonExemptEncryption: false
    # Sign in with Apple (enabled for the App ID io.github.kanylbullen.tung);
    # appleIdToken() in ui's iosMain asks for it. Generated like Info.plist.
    entitlements:
      path: Tung/Tung.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kanylbullen.tung
        # The owner's Apple Developer team (Individual); the App ID
        # io.github.kanylbullen.tung with Sign in with Apple lives there.
        # Automatic signing: Xcode makes the certificate and the profile once
        # the team's Apple ID is added under Xcode → Settings → Accounts.
        DEVELOPMENT_TEAM: 55BB3CFVQ3
        # Tung/Assets.xcassets: the launcher's plate at 1024 px, no alpha.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: Tung
        TARGETED_DEVICE_FAMILY: "1"
        # Gradle writes the framework for this configuration and SDK here.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework TungUI"
        # ui has iosSimulatorArm64 and no iosX64, so the simulator build is
        # arm64 only. A generic simulator destination would otherwise ask for
        # "arm64 x86_64", and Compose's syncComposeResourcesForIos fails on the
        # x86_64 half ("Cannot query the value of this provider").
        "ARCHS[sdk=iphonesimulator*]": arm64
        # The pre-build script runs Gradle, which reads and writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the TungUI framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode --no-daemon
