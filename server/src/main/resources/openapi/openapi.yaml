openapi: 3.1.0
info:
  title: Tung API
  version: 0.1.0
  summary: The open API of tung-server, the optional backend of the Tung strength-training log.
  description: |
    Everything the server can do, over HTTP. The app, the coming MCP server and
    any third party use this same surface; there are no private endpoints.

    **Auth.** Register or log in to get a session token, or create named API
    tokens for scripts and agents under `/api/v1/tokens`. Send a token as
    `Authorization: Bearer tung_…`. A token with scope `read` can only make GET
    requests. MCP clients get their tokens through OAuth 2.1 (`/oauth/…`):
    ordinary API tokens named `mcp:<client>` that expire unless refreshed.

    **Ids and `updated_at`.** Training data keeps the ids the client generated
    (lower-case UUIDs). Every row has `updated_at` (epoch milliseconds), and a
    write replaces a stored row only when its `updated_at` is strictly newer;
    equal or older writes are ignored row by row. Deletes are tombstones.
    `POST /api/v1/sync` applies the same rule to every row it is sent.
    All timestamps are epoch milliseconds.

    **Push.** Every write to training data (sync with rows, commands, MCP
    tools, the REST writes) sends an empty "sync now" to the user's other
    devices that registered a push endpoint. A client sends its device id as
    the `X-Tung-Device` header with its writes so it is skipped; a request
    without it counts as a client of its own.

    **Errors** are `{"error": {"code": "…", "message": "…"}}`.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /
tags:
  - name: health
    description: Liveness for load balancers and container health checks.
  - name: auth
    description: Accounts and session tokens.
  - name: tokens
    description: Named API tokens for scripts and agents.
  - name: link
    description: Sign a device in with a short code instead of a password (a watch).
  - name: exercises
    description: The catalogue and the user's own exercises.
  - name: workouts
    description: Workouts with their exercises and sets.
  - name: sync
    description: Row-level sync of the training data between the app and the server.
  - name: push
    description: Where the server wakes a device with an empty "sync now" when another client changes the data.
  - name: export
    description: All of the user's data in one document.
  - name: meta
    description: This specification.
  - name: commands
    description: The command surface from core, one to one under its wire names; the MCP tools run the same commands.
  - name: oauth
    description: OAuth 2.1 authorization server for MCP clients (discovery, dynamic registration, PKCE, rotating refresh tokens).
  - name: mcp
    description: The Model Context Protocol over streamable HTTP.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness and database check
      operationId: health
      security: []
      responses:
        "200":
          description: The server and its database are up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database cannot be reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /openapi.yaml:
    get:
      tags: [meta]
      summary: This specification
      operationId: openapi
      security: []
      responses:
        "200":
          description: The OpenAPI document. Swagger UI for it is at `/docs`.
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      description: Creates the user and returns a session token (scope `write`, name `session`). Rate-limited per client address.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      description: Returns a new session token. Rate-limited per client address.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Log out
      description: Revokes the token the request was made with.
      operationId: logout
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/link/start:
    post:
      tags: [link]
      summary: Get a code to link a device
      description: |
        Makes a six-digit numeric code for the caller's account, valid ten
        minutes and unique among the codes that have not expired. Another
        device, typically a watch where typing a password is impractical,
        sends it to `POST /api/v1/link/claim` and gets its own token. Needs a
        token with scope `write`. At most 5 codes a minute per user.
      operationId: linkStart
      responses:
        "201":
          description: The code, to show on the signed-in device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkCode" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/link/claim:
    post:
      tags: [link]
      summary: Trade a code for a token
      description: |
        Claims a code from `POST /api/v1/link/start`. A valid code that has
        not been claimed is marked claimed and answered with a new API token
        of that user (scope `write`, name `watch`, listed and revocable under
        `/api/v1/tokens`) and the user. A code works once: an unknown,
        expired or already claimed code is 404 `invalid_code`. No auth. At
        most 10 attempts a minute per client address.
      operationId: linkClaim
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkClaim" }
      responses:
        "200":
          description: Linked; the token is shown here and nowhere else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The code is unknown, expired or already claimed (`invalid_code`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/v1/me:
    get:
      tags: [auth]
      summary: The current user
      operationId: me
      responses:
        "200":
          description: The user the token belongs to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/tokens:
    get:
      tags: [tokens]
      summary: List active tokens
      description: Session tokens and named API tokens that are not revoked. Never includes a token's value.
      operationId: listTokens
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tokens]
      summary: Create an API token
      description: The plaintext token is in this response only; the server keeps its SHA-256.
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewToken" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tokens/{id}:
    delete:
      tags: [tokens]
      summary: Revoke a token
      operationId: revokeToken
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/exercises:
    get:
      tags: [exercises]
      summary: List exercises
      description: The shared catalogue plus the user's own exercises, sorted by name. A user's copy of a catalogue exercise (made when its rest time is changed) replaces the catalogue row.
      operationId: listExercises
      responses:
        "200":
          description: The exercises.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [exercises]
      summary: Create a custom exercise
      operationId: createExercise
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewExercise" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/exercises/{id}:
    patch:
      tags: [exercises]
      summary: Change an exercise
      description: An own exercise takes `name` and `rest_seconds`; a catalogue exercise only `rest_seconds`. Omitted fields are left as they are.
      operationId: updateExercise
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExercisePatch" }
      responses:
        "200":
          description: The exercise after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exercise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/exercises/{id}/last:
    get:
      tags: [exercises]
      summary: Last time
      description: The completed sets of this exercise from the most recent finished workout that contains it, in order. This drives "Last 80 × 8" and the pre-fill of new sets in the app.
      operationId: lastSession
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: exclude_workout_id
          in: query
          description: Skip this workout, normally the one in progress.
          schema: { type: string }
      responses:
        "200":
          description: The previous session's sets; `sets` is empty and `workout_id` null when there is none.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LastSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workouts:
    get:
      tags: [workouts]
      summary: List workouts
      description: Newest first, with exercises and sets nested. Page with `before`.
      operationId: listWorkouts
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: before
          in: query
          description: Only workouts that started before this time (epoch ms); pass the previous page's `next_before`.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: A page of workouts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkoutPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/workouts/{id}:
    get:
      tags: [workouts]
      summary: Get a workout
      operationId: getWorkout
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: The workout.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [workouts]
      summary: Create or replace a workout
      description: |
        Full nested upsert by the client's ids. Each row (the workout, each
        exercise, each set) is written only if its `updated_at` is newer than
        the stored one; a missing `updated_at` means now. Exercises and sets
        stored under this workout but missing from the body are deleted when
        they are older than the body's workout `updated_at`.
      operationId: putWorkout
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkoutInput" }
      responses:
        "200":
          description: The workout as stored after the merge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workout" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [workouts]
      summary: Delete a workout
      description: Tombstones the workout with its exercises and sets.
      operationId: deleteWorkout
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/workouts/{id}/finish:
    post:
      tags: [workouts]
      summary: Finish a workout
      description: |
        As in the app: sets that are not logged (completed with reps > 0) are
        dropped, then exercises without sets; a workout without one logged set
        is discarded instead of saved. Finishing a finished workout returns it
        unchanged. The body is optional.
      operationId: finishWorkout
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishInput" }
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinishResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/sync:
    post:
      tags: [sync]
      summary: Push changed rows and pull everything changed since the cursor
      description: |
        Row-level sync of the eight training-data tables, in one transaction.

        **Push.** `changes` holds the client's changed rows, one list per
        table, each the full row (snake_case, as the server's columns). A row
        is applied only when its `updated_at` is strictly newer than the
        stored one, or nothing is stored; equal or older rows are ignored. A
        tombstone is a row with `deleted_at` set: on a stored, older row it
        sets `deleted_at` and `updated_at` and keeps the row; for a row the
        server never had it is dropped. A live row newer than a stored
        tombstone brings the row back. The order of the lists does not
        matter: parents are written first and foreign keys are checked at
        commit. An exercise row with a catalogue id is the user's own copy
        and takes only `rest_seconds` from the client; the catalogue itself
        is never written.

        **Pull.** The answer holds every row of the user's whose server
        `seq` is above `cursor`, including the rows just pushed, plus the
        stored version of every pushed row that was ignored, so the client
        converges. `cursor` in the answer is the highest `seq` included (the
        request's cursor when nothing changed); send it next time. Every
        insert and update on the server, through any endpoint, takes a new
        `seq` from one sequence.

        A `read` token may call this with empty `changes` to pull only; a
        push needs scope `write`. At most 20 000 rows and 8 MiB per request.

        A request that pushes at least one row wakes the user's other devices
        through their push endpoints (`/api/v1/push/endpoints`); send your own
        device id as the `X-Tung-Device` header so you are not woken by your
        own change. A pull-only request wakes nobody.
      operationId: sync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRequest" }
      responses:
        "200":
          description: Everything changed since the cursor, and the new cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncResponse" }
        "400":
          description: The body cannot be read, or rows are invalid (`invalid_rows`, every offending row named). Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A live row refers to a parent (or an exercise) that does not exist (`missing_parent`, the rows named). Nothing was written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /api/v1/push/endpoints:
    get:
      tags: [push]
      summary: List push endpoints
      description: The caller's active (not revoked) push endpoints, oldest first.
      operationId: listPushEndpoints
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushEndpointList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [push]
      summary: Register a device's push endpoint
      description: |
        Tells the server where to wake this device. After a change made by
        another client (another device, a script, an MCP tool), the server
        sends an empty "sync now", `{"type":"sync"}`, never content, to every
        active endpoint of the user except the device that made the change
        (the device id sent as `X-Tung-Device` with its writes), debounced
        2 s per user. FCM: `endpoint` is the registration token (sent only
        when the server has a Firebase service account). UnifiedPush:
        `endpoint` is the distributor's URL, which the server POSTs to. It
        must be `https://` and its host, literal or resolved, must not be a
        loopback, link-local, private, carrier-grade NAT or multicast
        address, else 400 `invalid_endpoint`; an instance with
        `TUNG_PUSH_ALLOW_PRIVATE=true` (a distributor on its LAN) allows
        both. An endpoint that answers 404 or 410 (FCM `UNREGISTERED`) is
        revoked.

        One endpoint per `device_id`: registering again from the same device
        replaces its transport and endpoint, keeps its id and undoes a
        revocation (200); a new device gets 201. At most 20 active endpoints
        per user (409 `too_many_endpoints`).
      operationId: registerPushEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushEndpointRequest" }
      responses:
        "200":
          description: The device's endpoint was replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushEndpoint" }
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushEndpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/push/endpoints/{id}:
    delete:
      tags: [push]
      summary: Revoke a push endpoint
      description: The device gets no more pushes until it registers again.
      operationId: revokePushEndpoint
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/export:
    get:
      tags: [export]
      summary: Export everything
      description: One JSON document with all of the user's data, served as an attachment.
      operationId: export
      responses:
        "200":
          description: The export.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: attachment; filename=tung-export-YYYY-MM-DD.json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Export" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Commands, OAuth and MCP (issue #29) ---

  /api/v1/commands/{name}:
    post:
      tags: [commands]
      summary: Run a command
      description: |
        Runs one of core's commands (`core/command/`) by its stable wire name,
        through the server-side command handler that the MCP tools use too:
        validated like in the app, one transaction, and synced to the phone on
        its next sync. Needs a `write` token. The body is the command's fields
        (snake_case); an empty body is `{}`.

        An exercise is `{"key": "bench_press"}`, `{"id": "…"}`,
        `{"name": "Bänkpress"}` (exact names only, any catalogue language) or
        `{"extended": "<free-exercise-db id>"}`; a bare string is read as a
        name. A name that does not resolve is not guessed: the answer is
        `needs_answers` with suggestions, and nothing is written.

        | Command | Fields |
        |---|---|
        | `start_workout` | `routine_id`?, `program_day_id`? |
        | `start_routine` | `routine_id`, `program_day_id`? |
        | `add_exercise` | `workout_id`, `exercise` |
        | `remove_exercise` | `workout_exercise_id` |
        | `add_set` | `workout_exercise_id` |
        | `remove_set` | `set_id` |
        | `set_weight` | `set_id`, `weight_kg` (0–999), `apply_to_open_sets`? |
        | `set_reps` | `set_id`, `reps` (0–999), `apply_to_open_sets`? |
        | `tick_set` | `set_id`, `done` |
        | `log_set` | `workout_id`, `set_id`? (default: the current set) |
        | `select_current` | `set_id`? or `workout_exercise_id`? |
        | `finish_workout` | `workout_id` |
        | `delete_workout` | `workout_id` |
        | `apply_plan` | `exercises`: [{`exercise`, `sets`: [{`weight_kg`?, `reps`?}] or `set_count` + `reps`? + `weight_kg`?}] |
        | `set_rest` | `exercise_id`, `seconds` (0–3600 or null) |
        | `create_exercise` | `name`, `muscle_group`, `equipment` |
        | `save_routine` | `workout_id`, `name` |
        | `save_routine_plan` | `name`, `exercises`: [{`exercise`, `target_sets` (1–20), `target_reps`?}] |
        | `rename_routine` | `routine_id`, `name` |
        | `delete_routine` | `routine_id` |
        | `move_routine_exercise` | `routine_exercise_id`, `delta` |
        | `adjust_target_sets` | `routine_exercise_id`, `delta` |
        | `add_routine_exercise` | `routine_id`, `exercise`, `target_sets`? (1–20, default 3), `target_reps`? (1–999 or null) |
        | `remove_routine_exercise` | `routine_exercise_id` |
        | `set_target_reps` | `routine_exercise_id`, `target_reps` (1–999, or null to clear) |
        | `create_program` | `name`, `mode` (fixed, rotating) |
        | `rename_program` | `program_id`, `name` |
        | `set_program_mode` | `program_id`, `mode` (fixed, rotating) |
        | `activate_program` | `program_id` |
        | `deactivate_program` | `program_id` |
        | `delete_program` | `program_id` |
        | `add_program_day` | `program_id`, `routine_id` |
        | `remove_program_day` | `day_id` |
        | `move_program_day` | `day_id`, `delta` |
        | `toggle_program_weekday` | `day_id`, `weekday` (1 Monday … 7 Sunday) |

        The JSON Schema of each body is in the MCP server's `tools/list`.
      operationId: runCommand
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [start_workout, start_routine, add_exercise, remove_exercise, add_set, remove_set, set_weight, set_reps,
              tick_set, log_set, select_current, finish_workout, delete_workout, apply_plan, set_rest, create_exercise,
              save_routine, save_routine_plan, rename_routine, delete_routine, move_routine_exercise, adjust_target_sets,
              add_routine_exercise, remove_routine_exercise, set_target_reps,
              create_program, rename_program, set_program_mode, activate_program, deactivate_program, delete_program,
              add_program_day, remove_program_day, move_program_day, toggle_program_weekday]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            examples:
              log_set: { value: { workout_id: "0b1c9f5e-8c7a-4d2b-9f1e-3a5c7e9b1d2f" } }
              apply_plan:
                value:
                  exercises:
                    - { exercise: { key: deadlift }, set_count: 5, reps: 10, weight_kg: 50 }
                    - { exercise: { name: Bench press }, sets: [{ weight_kg: 60, reps: 10 }, { weight_kg: 62.5, reps: 8 }] }
      responses:
        "200":
          description: The command ran (`done`), or names something that needs an answer first (`needs_answers`, nothing written).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }
        "400":
          description: The body does not describe the command (`invalid_command`, naming every problem) or is not a JSON object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No command has that name (`unknown_command`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422":
          description: "Nothing ran (`rejected`): a value out of range, or an id that does not exist."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandResult" }

  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      summary: Authorization server metadata (RFC 8414)
      description: The issuer is `TUNG_PUBLIC_URL` (or, without it, the address the request reached).
      operationId: oauthAuthorizationServer
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthServerMetadata" }

  /.well-known/oauth-protected-resource:
    get:
      tags: [oauth]
      summary: Protected resource metadata (RFC 9728)
      description: Describes `/mcp` and names this server as its authorization server. A 401 from `/mcp` points here.
      operationId: oauthProtectedResource
      security: []
      responses:
        "200":
          description: The metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthResourceMetadata" }

  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [oauth]
      summary: Protected resource metadata for /mcp (RFC 9728 path form)
      operationId: oauthProtectedResourceMcp
      security: []
      responses:
        "200":
          description: The same metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthResourceMetadata" }

  /oauth/register:
    post:
      tags: [oauth]
      summary: Register a client (RFC 7591)
      description: |
        Open dynamic client registration, shared rate limit with login. Redirect
        URIs are matched exactly later: https, http only on localhost/127.0.0.1,
        or an app's own scheme, no fragment. Public clients
        (`token_endpoint_auth_method: none`, also the default here) get no secret.
      operationId: oauthRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OAuthClientRegistration" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClient" }
        "400":
          description: "`invalid_redirect_uri` or `invalid_client_metadata`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /oauth/authorize:
    get:
      tags: [oauth]
      summary: Authorization request (login and consent page)
      description: |
        PKCE is required (`code_challenge` with `code_challenge_method=S256`).
        Renders an HTML page with the client's name and the scope, where the
        user logs in and allows or denies. An unknown client or a redirect URI
        it did not register gets an error page; other errors go back to the
        redirect URI as `error`, `error_description`, `state` and `iss`.
      operationId: oauthAuthorize
      security: []
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: false, schema: { type: string }, description: "Required unless the client registered exactly one." }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: scope, in: query, required: false, schema: { type: string }, description: "`read`, `write` or `read write`; anything else or nothing means `read write`." }
        - { name: resource, in: query, required: false, schema: { type: string }, description: "RFC 8707 resource indicator; accepted and recorded." }
      responses:
        "200":
          description: The login and consent page.
          content:
            text/html:
              schema: { type: string }
        "302": { description: "An error sent back to the client's redirect URI." }
        "400":
          description: An error page (unknown client, unregistered redirect URI).
          content:
            text/html:
              schema: { type: string }
    post:
      tags: [oauth]
      summary: Consent form submission
      description: |
        The page's form: the authorization request again, `email`, `password`,
        `action` (`allow` or `deny`) and a CSRF token matched against a cookie.
        Allow with the right credentials redirects with a single-use `code`
        (five minutes) bound to the client, redirect URI, user, scope and code
        challenge. Rate limited like login.
      operationId: oauthConsent
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: The page again, with the error (wrong email or password).
          content:
            text/html:
              schema: { type: string }
        "302": { description: "Back to the redirect URI with `code`, `state` and `iss`, or with `error=access_denied`." }
        "400":
          description: An error page (expired form, unknown client).
          content:
            text/html:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /oauth/token:
    post:
      tags: [oauth]
      summary: Token endpoint
      description: |
        `authorization_code` (with `code_verifier`) or `refresh_token`. Public
        clients send `client_id`; confidential ones also `client_secret`.
        The access token is an ordinary API token (`mcp:<client name>` in the
        token list) valid for 30 days; each refresh gives it a new value and
        30 more days, and replaces the refresh token. A refresh token used
        twice revokes the grant; a code used twice revokes what it was
        exchanged for. Revoking the API token ends the client's access.
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                redirect_uri: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthTokens" }
        "400":
          description: "`invalid_request`, `invalid_grant` or `unsupported_grant_type`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
        "401":
          description: "`invalid_client`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }

  /mcp:
    post:
      tags: [mcp]
      summary: MCP messages (streamable HTTP)
      description: |
        One JSON-RPC 2.0 message or a batch. Requests are answered with JSON
        (or as one SSE event when the client accepts only
        `text/event-stream`); notifications alone get 202. `initialize`
        answers with an `Mcp-Session-Id`; a request carrying an id that has
        ended gets 404 and should initialize again. Protocol versions
        2025-06-18, 2025-03-26 and 2024-11-05. Tools: every command (as in
        `POST /api/v1/commands/{name}`) plus `history`, `last_time`,
        `current_workout`, `routines`, `programs` and `exercises`; prompts
        `suggest_program`, `next_workout`, `plateaus`; resource
        `tung://catalog/core`. A `read` token gets a tool error from tools
        that change data.
      operationId: mcpPost
      parameters:
        - { name: Mcp-Session-Id, in: header, required: false, schema: { type: string } }
        - { name: MCP-Protocol-Version, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: [object, array] }
      responses:
        "200":
          description: The JSON-RPC response (or batch of responses).
          headers:
            Mcp-Session-Id:
              schema: { type: string }
              description: On the answer to initialize.
          content:
            application/json:
              schema: { type: [object, array] }
            text/event-stream:
              schema: { type: string }
        "202": { description: "Notifications or responses only; nothing to answer." }
        "400":
          description: Not JSON (a JSON-RPC parse error) or an unsupported protocol version.
        "401":
          description: |
            No valid token. `WWW-Authenticate: Bearer resource_metadata="<base>/.well-known/oauth-protected-resource"`
            leads the client to the OAuth flow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The session in `Mcp-Session-Id` has ended (`session_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    get:
      tags: [mcp]
      summary: Server-to-client stream (not offered)
      description: "Always 405 for an authenticated request: the server sends nothing unasked."
      operationId: mcpGet
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405":
          description: No event stream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [mcp]
      summary: End a session
      operationId: mcpDelete
      parameters:
        - { name: Mcp-Session-Id, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: "Ended." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

security:
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A session token from register/login or an API token, both `tung_…`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Uuid" }

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No token, an unknown or revoked token, or wrong credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The token is read-only (`insufficient_scope`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found, or it belongs to another user.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with stored data.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests from this address; see `Retry-After`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: More than 8 MiB (`payload_too_large`) or more than 20 000 rows (`too_many_rows`). Push in batches.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Uuid:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      examples: ["0b1c9f5e-8c7a-4d2b-9f1e-3a5c7e9b1d2f"]
    Millis:
      type: integer
      format: int64
      minimum: 0
      description: Epoch milliseconds.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: ["not_found"] }
            message: { type: string }

    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, database_unavailable] }

    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 1024 }

    User:
      type: object
      required: [id, email, created_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        email: { type: string }
        created_at: { $ref: "#/components/schemas/Millis" }

    Session:
      type: object
      required: [token, user]
      properties:
        token: { type: string, examples: ["tung_3q2-…"] }
        user: { $ref: "#/components/schemas/User" }

    LinkCode:
      type: object
      required: [code, expires_at]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$", examples: ["042917"] }
        expires_at: { $ref: "#/components/schemas/Millis" }

    LinkClaim:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: "^[0-9]{6}$" }

    Token:
      type: object
      required: [id, name, scope, created_at, last_used_at, current]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        scope: { type: string, enum: [read, write] }
        created_at: { $ref: "#/components/schemas/Millis" }
        last_used_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: Updated at most once a minute.
        expires_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: When the token stops working; null for tokens that never expire. Tokens issued through OAuth (`mcp:<client>`) expire 30 days after they were issued or last refreshed. Revoking one ends that client's access, refresh included.
        current: { type: boolean, description: True for the token this request was made with. }

    TokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/Token" }

    NewToken:
      type: object
      required: [name, scope]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scope: { type: string, enum: [read, write] }

    CreatedToken:
      type: object
      required: [id, name, scope, created_at, token]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        scope: { type: string, enum: [read, write] }
        created_at: { $ref: "#/components/schemas/Millis" }
        token: { type: string, description: Shown once. }

    Exercise:
      type: object
      required: [id, name_key, name, muscle_group, equipment, is_custom, rest_seconds, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name_key:
          type: [string, "null"]
          description: The catalogue key (`bench_press`); null for custom exercises.
        name: { type: string, description: "The English name of a catalogue exercise, or what the user typed." }
        muscle_group: { $ref: "#/components/schemas/MuscleGroup" }
        equipment: { $ref: "#/components/schemas/Equipment" }
        is_custom: { type: boolean }
        rest_seconds:
          type: [integer, "null"]
          minimum: 0
          maximum: 3600
          description: Rest between sets; 0 is off, null follows the user's default.
        updated_at: { $ref: "#/components/schemas/Millis" }

    ExerciseList:
      type: object
      required: [exercises]
      properties:
        exercises:
          type: array
          items: { $ref: "#/components/schemas/Exercise" }

    NewExercise:
      type: object
      required: [name, muscle_group, equipment]
      properties:
        id: { $ref: "#/components/schemas/Uuid", description: Optional client-generated id. }
        name: { type: string, minLength: 1, maxLength: 100 }
        muscle_group: { $ref: "#/components/schemas/MuscleGroup" }
        equipment: { $ref: "#/components/schemas/Equipment" }
        rest_seconds: { type: [integer, "null"], minimum: 0, maximum: 3600 }

    ExercisePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        rest_seconds: { type: [integer, "null"], minimum: 0, maximum: 3600 }

    MuscleGroup:
      type: string
      enum: [chest, back, shoulders, biceps, triceps, legs, glutes, core, fullbody]
    Equipment:
      type: string
      enum: [barbell, dumbbell, machine, cable, bodyweight, other]

    Set:
      type: object
      required: [id, position, weight_kg, reps, completed, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        position: { type: integer, minimum: 0 }
        weight_kg: { type: number, minimum: 0, maximum: 999 }
        reps: { type: integer, minimum: 0, maximum: 999 }
        completed: { type: boolean }
        updated_at: { $ref: "#/components/schemas/Millis" }

    WorkoutExercise:
      type: object
      required: [id, exercise_id, position, updated_at, sets]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        exercise_id: { $ref: "#/components/schemas/Uuid" }
        position: { type: integer, minimum: 0 }
        updated_at: { $ref: "#/components/schemas/Millis" }
        sets:
          type: array
          items: { $ref: "#/components/schemas/Set" }

    Workout:
      type: object
      required: [id, started_at, ended_at, note, routine_id, program_day_id, updated_at, exercises, started_by]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        started_at: { $ref: "#/components/schemas/Millis" }
        ended_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: Null while the workout is in progress.
        note: { type: [string, "null"] }
        routine_id: { type: [string, "null"] }
        program_day_id: { type: [string, "null"] }
        updated_at: { $ref: "#/components/schemas/Millis" }
        exercises:
          type: array
          items: { $ref: "#/components/schemas/WorkoutExercise" }
        started_by:
          oneOf: [{ $ref: "#/components/schemas/StartedBy" }, { type: "null" }]
          description: Who started the workout; null when unknown (workouts from before the field).

    WorkoutPage:
      type: object
      required: [workouts, next_before]
      properties:
        workouts:
          type: array
          items: { $ref: "#/components/schemas/Workout" }
        next_before:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: Pass as `before` for the next page; null on the last page.

    SetInput:
      type: object
      required: [id, position, weight_kg, reps]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        position: { type: integer, minimum: 0 }
        weight_kg: { type: number, minimum: 0, maximum: 999 }
        reps: { type: integer, minimum: 0, maximum: 999 }
        completed: { type: boolean, default: false }
        updated_at: { $ref: "#/components/schemas/Millis" }

    WorkoutExerciseInput:
      type: object
      required: [id, exercise_id, position]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        exercise_id: { $ref: "#/components/schemas/Uuid", description: A catalogue exercise or one of the user's own. }
        position: { type: integer, minimum: 0 }
        updated_at: { $ref: "#/components/schemas/Millis" }
        sets:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/SetInput" }

    WorkoutInput:
      type: object
      required: [started_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid", description: Must equal the path id if given. }
        started_at: { $ref: "#/components/schemas/Millis" }
        ended_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
        note: { type: [string, "null"], maxLength: 10000 }
        routine_id: { type: [string, "null"] }
        program_day_id: { type: [string, "null"] }
        updated_at: { $ref: "#/components/schemas/Millis" }
        exercises:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WorkoutExerciseInput" }
        started_by:
          oneOf: [{ $ref: "#/components/schemas/StartedBy" }, { type: "null" }]
          description: Who started the workout. Set once; null or absent keeps the stored value.

    StartedBy:
      type: string
      enum: [phone, watch, server, agent]
      description: |
        Who started a workout: the phone app, the watch, the server on its
        own (reserved), or the server's command handler, i.e. a REST command
        or an MCP tool (an assistant or a script).

    PushTransport:
      type: string
      enum: [fcm, unifiedpush]

    PushEndpointRequest:
      type: object
      required: [device_id, transport, endpoint]
      properties:
        device_id: { type: string, minLength: 1, maxLength: 128, description: The device's own stable id, the one it sends as `X-Tung-Device`. }
        transport: { $ref: "#/components/schemas/PushTransport" }
        endpoint:
          type: string
          minLength: 1
          maxLength: 4096
          description: The FCM registration token, or the UnifiedPush distributor's URL (`https://`; `http://` only to localhost or a private IP).

    PushEndpoint:
      type: object
      required: [id, device_id, transport, endpoint, created_at, last_used_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        device_id: { type: string }
        transport: { $ref: "#/components/schemas/PushTransport" }
        endpoint: { type: string }
        created_at: { $ref: "#/components/schemas/Millis" }
        last_used_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: The last push the endpoint accepted.

    PushEndpointList:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items: { $ref: "#/components/schemas/PushEndpoint" }

    FinishInput:
      type: object
      properties:
        ended_at: { $ref: "#/components/schemas/Millis", description: Defaults to now. }

    FinishResult:
      type: object
      required: [workout, discarded]
      properties:
        workout:
          oneOf: [{ $ref: "#/components/schemas/Workout" }, { type: "null" }]
        discarded: { type: boolean, description: True when the workout had no logged set and was deleted instead. }

    LastSet:
      type: object
      required: [id, position, weight_kg, reps]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        position: { type: integer }
        weight_kg: { type: number }
        reps: { type: integer }

    LastSession:
      type: object
      required: [exercise_id, workout_id, started_at, sets]
      properties:
        exercise_id: { $ref: "#/components/schemas/Uuid" }
        workout_id: { type: [string, "null"] }
        started_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
        sets:
          type: array
          items: { $ref: "#/components/schemas/LastSet" }

    Export:
      type: object
      required: [format, version, exported_at, user, exercises, workouts, routines, programs, tokens]
      properties:
        format: { type: string, const: tung-export }
        version: { type: integer, const: 1 }
        exported_at: { $ref: "#/components/schemas/Millis" }
        user: { $ref: "#/components/schemas/User" }
        exercises:
          type: array
          description: The user's own exercises (custom ones and copies of catalogue exercises); the catalogue itself is open data in the repository.
          items: { $ref: "#/components/schemas/Exercise" }
        workouts:
          type: array
          items: { $ref: "#/components/schemas/Workout" }
        routines:
          type: array
          items: { $ref: "#/components/schemas/Routine" }
        programs:
          type: array
          items: { $ref: "#/components/schemas/Program" }
        tokens:
          type: array
          description: Names and scopes of active tokens; never their values.
          items:
            type: object
            required: [name, scope, created_at]
            properties:
              name: { type: string }
              scope: { type: string, enum: [read, write] }
              created_at: { $ref: "#/components/schemas/Millis" }

    Routine:
      type: object
      required: [id, name, last_used_at, updated_at, exercises]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        last_used_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: When a workout was last started from it.
        updated_at: { $ref: "#/components/schemas/Millis" }
        exercises:
          type: array
          items:
            type: object
            required: [id, exercise_id, position, target_sets, target_reps, updated_at]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              exercise_id: { $ref: "#/components/schemas/Uuid" }
              position: { type: integer, minimum: 0 }
              target_sets: { type: integer, minimum: 1, maximum: 20 }
              target_reps: { type: [integer, "null"], minimum: 0, maximum: 999 }
              updated_at: { $ref: "#/components/schemas/Millis" }

    Program:
      type: object
      required: [id, name, mode, is_active, updated_at, days]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        mode: { $ref: "#/components/schemas/ProgramMode" }
        is_active: { type: boolean }
        updated_at: { $ref: "#/components/schemas/Millis" }
        days:
          type: array
          items:
            type: object
            required: [id, routine_id, position, weekdays, updated_at]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              routine_id: { $ref: "#/components/schemas/Uuid" }
              position: { type: integer, minimum: 0 }
              weekdays: { $ref: "#/components/schemas/Weekdays" }
              updated_at: { $ref: "#/components/schemas/Millis" }

    ProgramMode:
      type: string
      enum: [fixed, rotating]
      description: "`fixed`: each day on chosen weekdays; `rotating`: day 1, 2, 3 in order, whatever the date."
    Weekdays:
      type: integer
      minimum: 0
      maximum: 127
      description: ISO weekdays as a bitmask, Monday in bit 0 … Sunday in bit 6.

    SyncRequest:
      type: object
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: The `cursor` of the previous response; 0 on the first sync.
        changes: { $ref: "#/components/schemas/SyncChanges" }

    SyncResponse:
      type: object
      required: [cursor, changes]
      properties:
        cursor:
          type: integer
          format: int64
          minimum: 0
          description: The highest server `seq` in `changes`, or the request's cursor when nothing changed.
        changes: { $ref: "#/components/schemas/SyncChanges" }

    SyncChanges:
      type: object
      description: One list per table. In a request, every list is optional; in a response, every list is present.
      properties:
        exercises: { type: array, items: { $ref: "#/components/schemas/SyncExercise" } }
        workouts: { type: array, items: { $ref: "#/components/schemas/SyncWorkout" } }
        workout_exercises: { type: array, items: { $ref: "#/components/schemas/SyncWorkoutExercise" } }
        sets: { type: array, items: { $ref: "#/components/schemas/SyncSet" } }
        routines: { type: array, items: { $ref: "#/components/schemas/SyncRoutine" } }
        routine_exercises: { type: array, items: { $ref: "#/components/schemas/SyncRoutineExercise" } }
        programs: { type: array, items: { $ref: "#/components/schemas/SyncProgram" } }
        program_days: { type: array, items: { $ref: "#/components/schemas/SyncProgramDay" } }

    # The sync rows. Only id and updated_at are always required. A live row
    # (deleted_at null) needs every column that is not nullable in its table;
    # a tombstone may leave them out or null, and they are not written.
    SyncTombstone:
      oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
      description: Set when the row is deleted (a tombstone); null or absent while it is live.

    SyncExercise:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name_key: { type: [string, "null"], description: The catalogue key; null for custom and extended-catalogue exercises. }
        name: { type: [string, "null"], maxLength: 500, description: Required on a live row unless the id is a catalogue id. }
        muscle_group:
          oneOf: [{ $ref: "#/components/schemas/MuscleGroup" }, { type: "null" }]
        equipment:
          oneOf: [{ $ref: "#/components/schemas/Equipment" }, { type: "null" }]
        is_custom: { type: [boolean, "null"] }
        rest_seconds: { type: [integer, "null"], minimum: 0, maximum: 3600, description: "0 is off, null follows the default." }
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    SyncWorkout:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        started_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: Required on a live row.
        ended_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
          description: Null while in progress; not before `started_at`.
        note: { type: [string, "null"], maxLength: 10000 }
        routine_id: { type: [string, "null"], description: A routine id; not checked, like in the app. }
        program_day_id: { type: [string, "null"], description: A program day id; not checked, like in the app. }
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }
        started_by:
          oneOf: [{ $ref: "#/components/schemas/StartedBy" }, { type: "null" }]
          description: Who started the workout. Set when it is made and never changed; a row with null keeps the stored value.

    SyncWorkoutExercise:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        workout_id: { type: [string, "null"], description: Required on a live row; the workout must exist. }
        exercise_id: { type: [string, "null"], description: Required on a live row; a catalogue exercise or one of the user's own. }
        position: { type: [integer, "null"], minimum: 0 }
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    SyncSet:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        workout_exercise_id: { type: [string, "null"], description: Required on a live row; the workout exercise must exist. }
        position: { type: [integer, "null"], minimum: 0 }
        weight_kg: { type: [number, "null"], minimum: 0, maximum: 999 }
        reps: { type: [integer, "null"], minimum: 0, maximum: 999 }
        completed: { type: [boolean, "null"] }
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    SyncRoutine:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: [string, "null"], maxLength: 500 }
        last_used_at:
          oneOf: [{ $ref: "#/components/schemas/Millis" }, { type: "null" }]
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    SyncRoutineExercise:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        routine_id: { type: [string, "null"], description: Required on a live row; the routine must exist. }
        exercise_id: { type: [string, "null"], description: Required on a live row; a catalogue exercise or one of the user's own. }
        position: { type: [integer, "null"], minimum: 0 }
        target_sets: { type: [integer, "null"], minimum: 1, maximum: 20 }
        target_reps: { type: [integer, "null"], minimum: 0, maximum: 999 }
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    SyncProgram:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: [string, "null"], maxLength: 500 }
        mode:
          oneOf: [{ $ref: "#/components/schemas/ProgramMode" }, { type: "null" }]
        is_active: { type: [boolean, "null"] }
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    SyncProgramDay:
      type: object
      required: [id, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        program_id: { type: [string, "null"], description: Required on a live row; the program must exist. }
        routine_id: { type: [string, "null"], description: Required on a live row; the routine must exist. }
        position: { type: [integer, "null"], minimum: 0 }
        weekdays:
          oneOf: [{ $ref: "#/components/schemas/Weekdays" }, { type: "null" }]
        updated_at: { $ref: "#/components/schemas/Millis" }
        deleted_at: { $ref: "#/components/schemas/SyncTombstone" }

    # --- Commands, OAuth and MCP (issue #29) ---

    CommandResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [done, needs_answers, rejected] }
        ids:
          type: object
          additionalProperties: { type: string }
          description: "With done: what the command created or acted on, under the stable keys of core's CommandIds: workoutId, workoutExerciseId, setId, addedSetId, exerciseId, routineId, programId, programDayId."
        questions:
          type: array
          description: "With needs_answers: one per exercise that did not resolve. Ask, then send the command again with the chosen ref."
          items:
            type: object
            required: [text, suggestions]
            properties:
              text: { type: string, description: "What was sent." }
              suggestions:
                type: array
                maxItems: 5
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    names: { type: array, items: { type: string } }
                    key: { type: [string, "null"] }
                    extended: { type: [string, "null"] }
                    ref: { type: object, description: "The exercise value that picks this suggestion, e.g. {\"key\": \"bench_press\"}." }
        reasons:
          type: array
          items: { type: string }
          description: "With rejected: every reason."

    OAuthError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string }

    OAuthServerMetadata:
      type: object
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        response_types_supported: { type: array, items: { type: string } }
        response_modes_supported: { type: array, items: { type: string } }
        grant_types_supported: { type: array, items: { type: string } }
        code_challenge_methods_supported: { type: array, items: { type: string } }
        token_endpoint_auth_methods_supported: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        authorization_response_iss_parameter_supported: { type: boolean }
        service_documentation: { type: string }

    OAuthResourceMetadata:
      type: object
      properties:
        resource: { type: string, description: "<base>/mcp" }
        authorization_servers: { type: array, items: { type: string } }
        scopes_supported: { type: array, items: { type: string } }
        bearer_methods_supported: { type: array, items: { type: string } }
        resource_name: { type: string }
        resource_documentation: { type: string }

    OAuthClientRegistration:
      type: object
      required: [redirect_uris]
      properties:
        redirect_uris: { type: array, items: { type: string }, minItems: 1, maxItems: 10 }
        client_name: { type: string, maxLength: 100 }
        token_endpoint_auth_method: { type: string, enum: [none, client_secret_post] }
        grant_types: { type: array, items: { type: string, enum: [authorization_code, refresh_token] } }
        response_types: { type: array, items: { type: string, enum: [code] } }

    OAuthClient:
      type: object
      required: [client_id, client_id_issued_at, client_name, redirect_uris, grant_types, response_types, token_endpoint_auth_method]
      properties:
        client_id: { type: string }
        client_id_issued_at: { type: integer, description: "Epoch seconds." }
        client_name: { type: string }
        redirect_uris: { type: array, items: { type: string } }
        grant_types: { type: array, items: { type: string } }
        response_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { type: string }
        scope: { type: string }
        client_secret: { type: string, description: "Confidential clients only, shown once." }
        client_secret_expires_at: { type: integer, description: "0, never." }

    OAuthTokens:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, scope]
      properties:
        access_token: { type: string, description: "An API token, `tung_…`." }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: "Seconds (30 days)." }
        refresh_token: { type: string, description: "`tungr_…`, single use." }
        scope: { type: string, enum: [read, read write] }
